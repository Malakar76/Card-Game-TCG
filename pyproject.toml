[project]
name = "card-game-tcg"
version = "0.1.0"
description = "Trading Card Game application with SQLite and Kivy"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    "pydantic>=2.12.0",
    "typing-inspection>=0.4.2",
    "pydantic-settings>=2.7.0",
    "kivy>=2.3.0",
    "camera4kivy>=0.0.1",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "properties>=0.6.1",
    "tcgdex-sdk>=2.2.1",
    "easyocr>=1.7.2",
]

[project.scripts]
card-game-tcg = "card_game_tcg.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/card_game_tcg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["p4a-recipes", "camerax_provider"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]
