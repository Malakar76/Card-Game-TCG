[project]
name = "card-game-tcg"
version = "0.1.0"
description = "Trading Card Game application with MongoDB and Qt"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beanie>=1.27.0",
    "motor>=3.6.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "PySide6>=6.8.0",
]

[project.scripts]
card-game-tcg = "card_game_tcg.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/card_game_tcg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-qt>=4.4.0",
    "ruff>=0.8.0",
]
